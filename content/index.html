<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>index gabarit</title>
		<style>
			html{
				font-family: sans-serif;
			}

			body{
				overflow: hidden !important;
				padding: 1rem !important;
				margin: 0 !important;
			}

			.fade-layer {
				position: absolute;
				left: 0;
				top: 0;
				right: 0;
				bottom: 0;
				background-color: white;
				z-index: 100;
				transition: all 0.3s;
			}

			header {
				display: flex;
				justify-content: space-between;
				width: 100%;
			}

			header .title {
				display: flex;
				align-items: center;
				gap: 1rem;
				position: relative;
				z-index: 200;

				h1{
					opacity: 0;
				}
			}

			nav {
				text-align: right;
				position: relative;
				z-index: 200;
				width: 50%;

				a {
					background-color: white;
					padding: 0.3rem 1rem;
					font-size: 1.5rem;
					color: var(--active-color);
					font-weight: bold;
					text-decoration: none;
					border-radius: 50px;
					border: solid 4px var(--active-color);
					margin-right: -0.3rem;
					transition: all 0.3s;
					transition: all 0.5s;
					position: relative;


				}
				a:hover {
					/* background-color: black;
					color: white; */
					cursor: pointer;
				}

				svg {
					position: relative;
				}
				a:nth-child(even) {
					border-radius: 10px !important;
				}
			}
		</style>
	</head>

	<body class="index-page">
		
		<div class="fade-layer"></div>
		<div id="app"></div>

		<a href="/a-propos">
			<img src="/images/info.png" alt="" srcset="" class="info">
		</a>

		<script type="module">
			import "@/scripts/indexPage.js";
			import "@/scripts/3DViewer.js";
		</script>

		<script>
			// get active color from local storage and set it to css variable
			const activeColor = localStorage.getItem("activeColor") || "#0F2E84";
			document.documentElement.style.setProperty("--active-color", activeColor);
		</script>
	</body>
</html>
